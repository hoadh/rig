name: Antigravity Sync Check

# Fails when antigravity/rig/ no longer matches what scripts/sync-antigravity-plugin.cjs generates from plugins/rig/
# and scripts/antigravity/, when files are missing or stale, or when it contains Claude Code-only references.
# `agy plugin validate --strict` is a release-checklist step (docs/how-to/release-rig.md), not a CI step: agy is not
# available on the runners.

on:
  push:
    branches: [main]
  # No path filter, so the check always reports and can be made a required status check.
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: antigravity/rig/ matches plugins/rig/
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      # Quoted globs: node expands them itself (`**` also matches the top level and `__tests__/`); an unquoted `**`
      # in sh would drop the top-level tests, and a path that matches nothing runs zero tests without failing.
      - name: Test the generator, rewrite rules, leftover check and hook adapter
        run: node --test 'scripts/antigravity/**/*.test.cjs' scripts/check-antigravity-version-bump.test.cjs

      # Compares a fresh build with the checkout file by file, regardless of .gitignore (git status cannot see ignored files).
      - name: Fail when antigravity/rig/ differs from a fresh build
        run: node scripts/sync-antigravity-plugin.cjs --check

      - name: Regenerate antigravity/rig/
        run: node scripts/sync-antigravity-plugin.cjs

      # Untracked files count: a generated file nobody committed is drift too.
      - name: Fail on drift, new files and stale files
        run: |
          drift=$(git status --porcelain --untracked-files=all -- antigravity)
          if [ -n "$drift" ]; then
            echo "$drift"
            git diff --stat -- antigravity
            echo "::error::antigravity/rig/ is out of date. Run 'node scripts/sync-antigravity-plugin.cjs' and commit the result."
            exit 1
          fi
          echo "OK antigravity/rig/ matches plugins/rig/"

      - name: Fail on Claude Code-only leftovers
        run: node scripts/sync-antigravity-plugin.cjs --check-leftovers
